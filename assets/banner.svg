<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Welcome to Shahriar Samee's GitHub">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="55%" stop-color="#071A2E"/>
      <stop offset="100%" stop-color="#0B3357"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DB8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B3357" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2A49"/>
      <stop offset="100%" stop-color="#081A2E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="278" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#8BCBFF">
      <circle cx="120" cy="40" r="1.4" opacity="0.8"/>
      <circle cx="300" cy="28" r="1" opacity="0.6"/>
      <circle cx="520" cy="46" r="1.3" opacity="0.7"/>
      <circle cx="760" cy="30" r="1" opacity="0.6"/>
      <circle cx="940" cy="52" r="1.5" opacity="0.8"/>
      <circle cx="1080" cy="36" r="1.1" opacity="0.6"/>
      <circle cx="200" cy="70" r="1" opacity="0.5"/>
      <circle cx="880" cy="74" r="1" opacity="0.5"/>
      <circle cx="640" cy="20" r="1.2" opacity="0.7"/>
    </g>

    <!-- horizon glow -->
    <rect x="0" y="176" width="1200" height="2" fill="#4DB8FF" opacity="0.5" filter="url(#glow)"/>

    <!-- back mountains -->
    <path d="M0,178 L170,96 L330,170 L500,104 L690,178 L860,120 L1030,176 L1200,110 L1200,178 Z" fill="url(#mback)" opacity="0.85"/>
    <!-- front mountains -->
    <path d="M0,200 L120,150 L260,200 L430,138 L560,200 L740,156 L900,200 L1040,150 L1200,200 L1200,280 L0,280 Z" fill="#081524"/>

    <!-- river -->
    <path d="M588,178 L612,178 L660,280 L540,280 Z" fill="url(#river)"/>
    <path d="M594,190 L606,190 L612,210 L588,210 Z" fill="#8BCBFF" opacity="0.35"/>
    <path d="M590,224 L610,224 L620,250 L580,250 Z" fill="#8BCBFF" opacity="0.2"/>

    <!-- text -->
    <text x="600" y="120" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="38" font-weight="700" fill="#E6F3FF" filter="url(#glow)">Welcome to Shahriar Samee's GitHub</text>
    <text x="600" y="160" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="22" font-weight="700" fill="#4DB8FF" letter-spacing="2">&lt;/&gt;</text>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#0B5FA5" stroke-width="2"/>
  </g>
</svg>
