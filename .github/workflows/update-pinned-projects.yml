name: Update pinned projects

on:
  workflow_dispatch:
  schedule:
    # GitHub does not emit an event when profile pins are reordered.
    # Poll periodically so pin/unpin/reorder changes appear automatically.
    - cron: "17 */6 * * *"
  push:
    paths:
      - "README.md"
      - "scripts/update_pinned.py"
      - ".github/workflows/update-pinned-projects.yml"

permissions:
  contents: write

concurrency:
  group: update-pinned-projects
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pinned.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync pinned GitHub projects"
          file_pattern: README.md
