name: Update Pinned Projects

on:
  schedule:
    - cron: "0 2 * * *"     # daily at 02:00 UTC
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches: [ main ]       # also refresh on push to main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Featured Projects from pinned repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pinned.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh pinned projects"
          git push
