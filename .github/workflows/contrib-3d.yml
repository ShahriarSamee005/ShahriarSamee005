name: Generate 3D contribution chart

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"      # daily
  push:
    paths:
      - "scripts/gen_contrib.py"
      - ".github/workflows/contrib-3d.yml"

permissions:
  contents: write

concurrency:
  group: contrib-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom 3D contribution SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_contrib.py

      - name: Commit generated chart
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contribution chart"
          file_pattern: assets/contrib-3d.svg
